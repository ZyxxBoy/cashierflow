name: CashierFlow CD

on:
  workflow_run:
    workflows: ["CashierFlow CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cashierflow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: cd-production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')

    environment: production

    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_PRODUCTION_DATABASE_URL_UNPOOLED }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify latest main commit
        shell: bash
        run: |
          LATEST_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LATEST_SHA" != "$DEPLOY_SHA" ]; then
            echo "Deployment stopped: a newer commit exists on main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          for key in DATABASE_URL_UNPOOLED VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Deploy production migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Prepare build timezone
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(".vercel/.env.production.local")

          if not path.exists():
              raise SystemExit("Vercel production env file not found")

          lines = path.read_text(encoding="utf-8").splitlines()

          lines = [
              line for line in lines
              if not re.match(
                  r"^\s*(?:export\s+)?STORE_TIMEZONE\s*=",
                  line,
              )
          ]

          lines.append('STORE_TIMEZONE="Asia/Jakarta"')

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print("Production build timezone configured")

          # Verify the configured timezone
          import subprocess

          subprocess.run(
              [
                  "node",
                  "-e",
                  "new Intl.DateTimeFormat('en-US', "
                  "{timeZone:'Asia/Jakarta'}); "
                  "console.log('Timezone validation passed')",
              ],
              check=True,
          )
          PY

      - name: Build production application
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
